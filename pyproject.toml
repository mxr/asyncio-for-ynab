[project]
name = "asyncio_for_ynab"
version = "1.87.0"
description = "Unofficial asyncio client for the YNAB API."
readme = "README.md"
requires-python = ">=3.11"  # generated by mxr/base
license = "MIT"  # generated by mxr/base
license-files = ["LICENSE"]  # generated by mxr/base
authors = [{ name = "Max R", email = "mxr@users.noreply.github.com" }]  # generated by mxr/base
keywords = ["asyncio", "budget", "httpx", "openapi", "ynab"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: Implementation :: CPython",
]
dependencies = [
  "httpx>=0.28.1",
  "pydantic>=2.11",
  "python-dateutil>=2.8.2",
  "typing-extensions>=4.7.1",
]

[project.urls]  # generated by mxr/base
Homepage = "https://github.com/mxr/asyncio-for-ynab"

[dependency-groups]
dev = [
  "aioresponses",
  "covdefaults>=2.1.0",
  "coverage",
  "pytest",
  "pytest-asyncio",
]

[build-system]  # generated by mxr/base
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.coverage.run]  # generated by mxr/base
plugins = ["covdefaults"]

[tool.mypy]  # generated by mxr/base
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]  # generated by mxr/base
disallow_untyped_defs = false
module = "testing.*"

[[tool.mypy.overrides]]  # generated by mxr/base
disallow_untyped_defs = false
module = ["test_custom.*", "test.*"]

[[tool.mypy.overrides]]  # generated by mxr/base
ignore_errors = true
module = ["asyncio_for_ynab.*", "test.*"]

[tool.pyright]  # generated by mxr/base
exclude = ["asyncio_for_ynab", "test"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff.lint]  # generated by mxr/base
extend-select = [
  "A",  # see flake8-builtins
  "B",  # see flake8-bugbear
  "C4",  # see flake8-comprehension
  "I",  # sort imports
  "SIM",  # see flake8-simplify
  "TC",  # see flake8-type-checking
  "UP",  # see pyupgrade
]

[tool.ruff.lint.isort]  # generated by mxr/base
force-single-line = true
required-imports = ["from __future__ import annotations"]

[tool.setuptools.package-data]
asyncio_for_ynab = ["py.typed"]

[tool.setuptools.packages]  # generated by mxr/base
find = {}

[tool.tombi]  # generated by mxr/base
offline = true
string-quote-style = "double"

[tool.tox]  # generated by mxr/base
env_list = ["py", "pre-commit"]

[tool.tox.env.pre-commit]  # generated by mxr/base
commands = [["pre-commit", "run", "--all-files", "--show-diff-on-failure"]]
deps = ["pre-commit-uv"]
skip_install = true

[tool.tox.env_run_base]  # generated by mxr/base
commands = [
  ["coverage", "erase"],
  ["coverage", "run", "-m", "pytest", { replace = "posargs", default = ["test_custom", "test"], extend = true }],
  ["coverage", "report"],
]
dependency_groups = ["dev"]

[tool.ty.rules]  # generated by mxr/base
all = "error"

[tool.ty.src]  # generated by mxr/base
exclude = ["asyncio_for_ynab", "test"]
