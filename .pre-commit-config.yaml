# these are generated
default_language_version:
  python: python3.11
exclude: |
  (?x)^(
      asyncio_for_ynab/.+|
      docs/.+|
      test/.+
  )$

repos:
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: 2eeb5678de71a00c0902cbda7105d328432f72cb  # frozen: v0.16.8
  hooks:
  - id: ruff-check
    args: [--fix]
  - id: ruff-format
- repo: https://github.com/biomejs/pre-commit
  rev: 221fa73eac76e0540995318b44e2efb2774af990  # frozen: v2.5.14
  hooks:
  - id: biome-check
- repo: https://github.com/hukkin/mdformat
  rev: 2d496dbc18e31b83a1596685347ffe0b6041daf0  # frozen: 1.0.0
  hooks:
  - id: mdformat
    args: [--number, --wrap, '120']
    additional_dependencies:
    - mdformat-gfm
- repo: https://github.com/macisamuele/language-formatters-pre-commit-hooks
  rev: 4380fbb73a154b5f5624794c1c78d9719ccc860f  # frozen: v2.16.0
  hooks:
  - id: pretty-format-toml
    args: [--autofix, --trailing-commas]
  - id: pretty-format-yaml
    args: [--autofix]
    exclude: config/spec.yaml
- repo: https://github.com/mxr/mirrors-openapi-generator-cli
  rev: b6ce956d43315dba7c704f89f72963bdfd7c38b8  # frozen: v7.25.0
  hooks:
  - id: openapi-generator-cli
    alias: openapi-validate
    name: validate OpenAPI spec
    args: [validate, -i, config/spec.yaml]
    pass_filenames: false
    files: |
      (?x)^(
          config/.*\.ya?ml
      )$
  - id: openapi-generator-cli
    alias: openapi-generate
    name: generate async YNAB SDK
    args: [generate, -i, config/spec.yaml, -g, python, -c, config/openapi.yaml, -t, templates/python, -o, ., --minimal-update]
    pass_filenames: false
    files: |
      (?x)^(
          config/.*\.ya?ml|
          templates/python/.*\.mustache
      )$
- repo: https://github.com/mxr/mirrors-pyright
  rev: 917816f768b32cc3aabd877e48b9001e7bf1b35c  # frozen: v1.1.414
  hooks:
  - id: pyright
    additional_dependencies:
    - aioresponses
    - coverage
    - httpx>=0.28.1
    - pydantic>=2.11
    - pytest
    - pytest-asyncio
    - types-python-dateutil
    - types-setuptools
    - typing-extensions>=4.7.1
- repo: https://github.com/mxr/mirrors-ty
  rev: 247350e02d5017e6936ece7b0c05f936c6aef207  # frozen: v0.0.82
  hooks:
  - id: ty
    additional_dependencies:
    - aioresponses
    - coverage
    - httpx>=0.28.1
    - pydantic>=2.11
    - pytest
    - pytest-asyncio
    - types-python-dateutil
    - types-setuptools
    - typing-extensions>=4.7.1
- repo: https://github.com/mxr/sync-typing-deps
  rev: 896a112838d434d8e607d4d636323c5914ab933f  # frozen: v0.7.0
  hooks:
  - id: sync-typing-deps
- repo: https://github.com/pre-commit/mirrors-mypy
  rev: 7ff8d35ae36a7d2b968f2f90b4c723e292e594ee  # frozen: v2.3.1
  hooks:
  - id: mypy
    additional_dependencies:
    - aioresponses
    - coverage
    - httpx>=0.28.1
    - pydantic>=2.11
    - pytest
    - pytest-asyncio
    - types-python-dateutil
    - types-setuptools
    - typing-extensions>=4.7.1
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
  hooks:
  - id: check-docstring-first
  - id: debug-statements
  - id: end-of-file-fixer
  - id: trailing-whitespace
    exclude: config/spec.yaml
- repo: https://github.com/rhysd/actionlint
  rev: 914e7df21a07ef503a81201c76d2b11c789d3fca  # frozen: v1.7.12
  hooks:
  - id: actionlint
    additional_dependencies:
    - github.com/wasilibs/go-shellcheck/cmd/shellcheck@latest
- repo: https://github.com/zizmorcore/zizmor-pre-commit
  rev: fa412071e4f5d44d44f9e365f4676f9df92456a2  # frozen: v1.30.1
  hooks:
  - id: zizmor
    args: [--no-progress, --fix]
- repo: local
  hooks:
  - id: biome-schema-version
    name: biome schema version
    entry: |-
      python3 -c 'import re, pathlib; cfg = pathlib.Path(".pre-commit-config.yaml").read_text(); ver = re.search(r"biomejs/pre-commit.*?frozen: v([0-9.]+)", cfg, re.S)[1]; p = pathlib.Path("biome.json"); p.write_text(re.sub(r"schemas/[^/]+/schema\.json", f"schemas/{ver}/schema.json", p.read_text()))'
    language: python
    files: ^(biome\.json|\.pre-commit-config\.yaml)$
    pass_filenames: false
