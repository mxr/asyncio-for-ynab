# these are generated
exclude: |
  (?x)^(
      asyncio_for_ynab/.+|
      docs/.+|
      test/.+
  )$

repos:
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: 1f1e8bf348ff38fc88619a38d3ca4d9c56abea49  # frozen: v0.16.5
  hooks:
  - id: ruff-check
    args: [--fix]
  - id: ruff-format
- repo: https://github.com/macisamuele/language-formatters-pre-commit-hooks
  rev: 4380fbb73a154b5f5624794c1c78d9719ccc860f  # frozen: v2.16.0
  hooks:
  - id: pretty-format-toml
    args: [--autofix, --trailing-commas]
  - id: pretty-format-yaml
    args: [--autofix]
    exclude: config/spec.yaml
- repo: https://github.com/mxr/mirrors-openapi-generator-cli
  rev: b6ce956d43315dba7c704f89f72963bdfd7c38b8  # frozen: v7.25.0
  hooks:
  - id: openapi-generator-cli
    alias: openapi-validate
    name: validate OpenAPI spec
    args: [validate, -i, config/spec.yaml]
    pass_filenames: false
    files: |
      (?x)^(
          config/.*\.ya?ml
      )$

  - id: openapi-generator-cli
    alias: openapi-generate
    name: generate async YNAB SDK
    args: [generate, -i, config/spec.yaml, -g, python, -c, config/openapi.yaml, -t, templates/python, -o, ., --minimal-update]
    pass_filenames: false
    files: |
      (?x)^(
          config/.*\.ya?ml|
          templates/python/.*\.mustache
      )$
- repo: https://github.com/mxr/mirrors-ty
  rev: 429804df3fe7b725a9a36f196e9a5390c9f12cd3  # frozen: v0.0.76
  hooks:
  - id: ty
    additional_dependencies:
    - aioresponses
    - coverage
    - httpx>=0.28.1
    - pydantic>=2.11
    - pytest
    - pytest-asyncio
    - types-python-dateutil
    - types-setuptools
    - typing-extensions>=4.7.1
    language_version: python3.10
- repo: https://github.com/mxr/sync-typing-deps
  rev: 827c0d0f5b5dda0644170665034006604f9eb10b  # frozen: v0.6.0
  hooks:
  - id: sync-typing-deps
- repo: https://github.com/pre-commit/mirrors-mypy
  rev: 7ff8d35ae36a7d2b968f2f90b4c723e292e594ee  # frozen: v2.3.1
  hooks:
  - id: mypy
    language_version: python3.10
    additional_dependencies:
    - aioresponses
    - coverage
    - httpx>=0.28.1
    - pydantic>=2.11
    - pytest
    - pytest-asyncio
    - types-python-dateutil
    - types-setuptools
    - typing-extensions>=4.7.1
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
  hooks:
  - id: check-docstring-first
  - id: debug-statements
  - id: end-of-file-fixer
  - id: pretty-format-json
    args: [--autofix, --indent=2]
  - id: trailing-whitespace
    exclude: config/spec.yaml
- repo: https://github.com/rhysd/actionlint
  rev: 914e7df21a07ef503a81201c76d2b11c789d3fca  # frozen: v1.7.12
  hooks:
  - id: actionlint
    additional_dependencies:
    - github.com/wasilibs/go-shellcheck/cmd/shellcheck@latest
- repo: https://github.com/zizmorcore/zizmor-pre-commit
  rev: cef8b8350da46d8114c7e6b7272aebdccdf193ce  # frozen: v1.30.0
  hooks:
  - id: zizmor
    args: [--no-progress, --fix]
