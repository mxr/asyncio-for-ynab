name: Generate SDK
description: Validate the YNAB spec and regenerate the SDK from it and the templates

runs:
  using: composite
  steps:
  - name: Validate OpenAPI spec
    uses: docker://openapitools/openapi-generator-cli:v7.27.0@sha256:949efd0d5cf3c093ef169887b2ebe0879ee2e8074b6476264232ce4fd8ef46d0
    with:
      args: validate -i config/spec.yaml

  - name: Generate async YNAB SDK
    uses: docker://openapitools/openapi-generator-cli:v7.27.0@sha256:949efd0d5cf3c093ef169887b2ebe0879ee2e8074b6476264232ce4fd8ef46d0
    with:
      args: generate -i config/spec.yaml -g python -c config/openapi.yaml -t templates/python -o . --minimal-update

  - name: Reclaim generated files
    shell: bash
    # docker steps run as root, so reclaim generated files for later git operations
    run: sudo chown -R "$(id -u):$(id -g)" .
