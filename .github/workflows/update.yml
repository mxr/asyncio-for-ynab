name: Update

on:
  workflow_dispatch:
  schedule:
  - cron: 5 0 * * *     # every day at 00:05 UTC

permissions: {}

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      with:
        persist-credentials: false
        fetch-depth: 0

    - name: Download upstream spec
      id: download
      env:
        # Pin of api.ynab.com's SubjectPublicKeyInfo, generated via:
        #   openssl s_client -connect api.ynab.com:443 </dev/null 2>/dev/null |
        #   openssl x509 -pubkey -noout |
        #   openssl pkey -pubin -outform der |
        #   openssl dgst -sha256 -binary | base64
        YNAB_API_PUBKEY_PIN: ${{ vars.YNAB_API_PUBKEY_PIN }}
      run: |
        tmp="$(mktemp)"
        trap 'rm -f "$tmp"' EXIT

        curl \
          --fail \
          --location \
          --noproxy '*' \
          --pinnedpubkey sha256//"$YNAB_API_PUBKEY_PIN" \
          --show-error \
          --silent \
          --tlsv1.2 \
          "https://api.ynab.com/papi/open_api_spec.yaml" \
          --output "$tmp"

        if cmp -s config/spec.yaml "$tmp"; then
          echo "YNAB spec is already current."
          echo "SPEC_CHANGED=false" >> "$GITHUB_ENV"
          exit 0
        fi

        mv "$tmp" config/spec.yaml
        trap - EXIT
        echo "SPEC_CHANGED=true" >> "$GITHUB_ENV"

    - name: Sync generator version
      if: env.SPEC_CHANGED == 'true'
      run: |
        version="$(sed -n 's/^  version: //p' config/spec.yaml | head -n 1)"

        if [ -z "$version" ]; then
          echo "could not read info.version from config/spec.yaml" >&2
          exit 1
        fi

        tmp="$(mktemp)"
        trap 'rm -f "$tmp"' EXIT
        sed "s/^packageVersion: .*/packageVersion: $version/" config/openapi.yaml > "$tmp"
        mv "$tmp" config/openapi.yaml
        trap - EXIT
        echo "SPEC_VERSION=$version" >> "$GITHUB_ENV"

    - name: Validate OpenAPI spec
      uses: docker://openapitools/openapi-generator-cli:v7.25.0@sha256:2ab0a9680222de65dc9d3baf861aa02b99e1b80c211d8221ebf3ae8f8a102524
      with:
        args: validate -i config/spec.yaml

    - name: Generate async YNAB SDK
      uses: docker://openapitools/openapi-generator-cli:v7.25.0@sha256:2ab0a9680222de65dc9d3baf861aa02b99e1b80c211d8221ebf3ae8f8a102524
      with:
        args: generate -i config/spec.yaml -g python -c config/openapi.yaml -t templates/python -o . --minimal-update

    - name: Check for changes
      run: |
        # docker steps run as root, so reclaim generated files for later git operations
        sudo chown -R "$(id -u):$(id -g)" .

        if [ -z "$(git status --porcelain)" ]; then
          echo "Generated SDK is already current."
          echo "CHANGED=false" >> "$GITHUB_ENV"
        else
          echo "CHANGED=true" >> "$GITHUB_ENV"
        fi

    - name: Determine title
      if: env.CHANGED == 'true'
      run: |
        generator_version="$(cat .openapi-generator/VERSION)"

        if [ "$SPEC_CHANGED" != 'true' ]; then
          echo "SPEC_TITLE=Generate YNAB SDK with openapi generator v$generator_version" >> "$GITHUB_ENV"
          exit 0
        fi

        base_title="Update YNAB API spec to v$SPEC_VERSION"
        pattern="^${base_title}( \(revision [0-9]+\))?"

        latest_tag="$(git describe --tags --abbrev=0)"

        # Count prior commits since the latest release tag that updated to
        # the same spec version, so a same-version doc-only re-sync gets a
        # distinguishing "(revision N)" suffix instead of an identical,
        # confusing title.
        count="$(git log --oneline --grep="$pattern" --extended-regexp "$latest_tag"^..HEAD | wc -l | tr -d ' ')"

        title="$base_title"
        if [ "$count" -ne 0 ]; then
          title="$title (revision $((count + 1)))"
        fi

        if ! git diff --quiet -- .openapi-generator/VERSION; then
          title="$title and openapi generator to v$generator_version"
        fi

        echo "SPEC_TITLE=$title" >> "$GITHUB_ENV"
      env:
        SPEC_VERSION: ${{ env.SPEC_VERSION }}

    - name: Create pull request
      if: env.CHANGED == 'true'
      uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1   # v8.1.1
      env:
        SPEC_TITLE: ${{ env.SPEC_TITLE }}
      with:
        branch: update-ynab-spec
        title: ${{ env.SPEC_TITLE }}
        commit-message: ${{ env.SPEC_TITLE }}
        body: ''
