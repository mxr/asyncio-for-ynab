# ~~ Generated by projen in mxr/base. Modifications will be overwritten on the next sync. To modify properly, edit .github/base.yml and retrigger the propagate workflow in mxr/base.

pull_request_rules:
- name: automatic merge for pre-commit ci updates
  conditions:
  - author=pre-commit-ci[bot]
  - title=[pre-commit.ci] pre-commit autoupdate
  actions:
    merge:
      method: squash
- name: automatic merge for renovate updates
  conditions:
  - author=renovate[bot]
  actions:
    merge:
      method: squash
- name: automatic merge for base updates
  conditions:
  - author=mxr-base-sync[bot]
  actions:
    merge:
      method: squash
- name: automatic merge for spec updates
  conditions:
  - author=github[bot]
  - title~=^(Update YNAB API spec|Generate YNAB SDK with openapi generator)
  actions:
    merge:
      method: squash
